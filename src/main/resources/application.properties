spring.application.name=ejercicio

# Conexión PostgreSQL
# OJO: tu script SQL crea la base "ejercicio", pero aquí dice "pruebas". Deben llamarse IGUAL.
# Cambia el nombre de abajo por el de la base donde ejecutaste el script.
spring.datasource.url=jdbc:postgresql://localhost:5432/parkypro
spring.datasource.username=postgres
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# CORREGIDO: se quitó spring.jpa.database-platform. Hibernate detecta PostgreSQL solo
# y esa propiedad da advertencias en las versiones nuevas.