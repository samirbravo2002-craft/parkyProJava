<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!--
    LAYOUT COMPARTIDO. Todas las pantallas lo usan así:
      <head th:replace="~{fragments/layout :: head('Título')}"></head>
      <div th:replace="~{fragments/layout :: header('reservas')}"></div>   (reservas | agregar | servicios)
      ... contenido ...
      <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    El encabezado incluye el dashboard, por eso se ve SIEMPRE arriba al cambiar de sección.
-->

<!-- ===================== HEAD (estilos comunes) ===================== -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - ParkyPro'">ParkyPro</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #eef1f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ---- Barra superior ---- */
        .navbar-custom {
            background-color: #121212;
            border-bottom: 4px solid #ffc107;
        }

        /* ---- Dashboard ---- */
        .dash-wrap {
            background: linear-gradient(135deg, #0a192f 0%, #173a6e 100%);
        }

        .kpi {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: .9rem;
            color: #fff;
            padding: .9rem 1.1rem;
            height: 100%;
        }

        .kpi .etiqueta {
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: #9fb3d1;
            font-weight: 600;
        }

        .kpi .valor {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.1;
        }

        .kpi .valor small {
            font-size: 1rem;
            font-weight: 600;
            color: #9fb3d1;
        }

        .kpi .sub {
            font-size: .78rem;
            color: #9fb3d1;
        }

        .kpi .progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
        }

        .kpi-icono {
            color: #ffc107;
            font-size: 1.4rem;
        }

        .kpi-dinero .valor {
            color: #ffc107;
        }

        /* ---- Secciones (Reservas / Agregar / Servicios) ---- */
        .nav-secciones .nav-link {
            color: #121212;
            font-weight: 700;
            background: #fff;
            border: 1px solid #dde3ee;
            padding: .6rem 1.3rem;
        }

        .nav-secciones .nav-link:hover {
            background: #fff7d6;
        }

        .nav-secciones .nav-link.active {
            background: #ffc107;
            border-color: #ffc107;
            color: #121212;
        }

        .nav-tabs .nav-link {
            color: #495057;
            font-weight: 600;
        }

        .nav-tabs .nav-link.active {
            color: #121212;
            border-bottom: 3px solid #ffc107;
            font-weight: 700;
        }

        /* ---- Botones ---- */
        .btn-amarillo {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #121212;
            font-weight: 700;
        }

        .btn-amarillo:hover {
            background-color: #e0a800;
            border-color: #d39e00;
            color: #000000;
        }

        /* ---- Tarjetas y tablas ---- */
        .card-panel {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(10, 25, 47, 0.08);
        }

        .card-panel>.card-header {
            background-color: #121212;
            color: #fff;
            border-bottom: 4px solid #ffc107;
            border-radius: 1rem 1rem 0 0 !important;
            padding: .85rem 1.25rem;
            font-weight: 700;
        }

        .card-panel>.card-header i {
            color: #ffc107;
        }

        .table-custom th {
            background-color: #0a192f !important;
            color: #ffffff !important;
            white-space: nowrap;
        }

        /* ---- Pantallas de formulario / detalle (cliente y limpiador) ---- */
        .card-header-custom {
            background-color: #121212;
            color: #ffffff;
            border-bottom: 5px solid #ffc107;
            border-top-left-radius: 1rem !important;
            border-top-right-radius: 1rem !important;
        }

        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(10, 25, 47, 0.18);
        }

        /* ---- Impresión (voucher): solo se imprime el comprobante ---- */
        @media print {
            .no-print {
                display: none !important;
            }

            body {
                background: #fff !important;
            }

            .voucher-card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
        }
    </style>
</head>

<body>

    <!-- ===================== ENCABEZADO: barra + dashboard + secciones + mensajes ===================== -->
    <div th:fragment="header(seccion)" class="no-print">

        <nav class="navbar navbar-dark navbar-custom px-4 py-3 shadow-sm">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1 fw-bold d-flex align-items-center">
                    <img th:src="@{/img/logo.png}" alt="ParkyPro" height="36" class="me-2"> ParkyPro
                    <small class="text-secondary fw-normal fs-6 ms-1">Control</small>
                </span>
                <div class="d-flex align-items-center text-white">
                    <span class="me-3 small">
                        <i class="bi bi-person-circle text-warning"></i>
                        Usuario: <b th:text="${usuarioActual}"></b>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i>
                            Salir</button>
                    </form>
                </div>
            </div>
        </nav>

        <!-- Dashboard fijo -->
        <div class="dash-wrap py-3 shadow-sm">
            <div class="container-xxl">
                <div th:replace="~{fragments/layout :: dashboard}"></div>
            </div>
        </div>

        <!-- Secciones -->
        <div class="container-xxl mt-4">
            <ul class="nav nav-pills nav-secciones gap-2">
                <li class="nav-item" th:if="${puedeOperar}">
                    <a class="nav-link" th:classappend="${seccion == 'reservas'} ? 'active'"
                        th:href="@{/reservas/nueva}">
                        <i class="bi bi-calendar-check"></i> Reservas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'agregar'} ? 'active'" th:href="@{/agregar}">
                        <i class="bi bi-people"></i> Agregar
                    </a>
                </li>
                <li class="nav-item" th:if="${puedeOperar}">
                    <a class="nav-link" th:classappend="${seccion == 'servicios'} ? 'active'" th:href="@{/servicios}">
                        <i class="bi bi-tags"></i> Servicios
                    </a>
                </li>
            </ul>
        </div>

        <div th:replace="~{fragments/layout :: mensajes}"></div>
    </div>

    <!-- ===================== DASHBOARD (se actualiza solo cada 15 s) ===================== -->
    <div id="dashboard-wrap" th:fragment="dashboard" th:if="${dash != null}">
        <div class="row g-3">

            <!-- Un cuadro por tipo de vehículo (Carro, Moto, ...) -->
            <div class="col-12 col-md-6 col-xl-3" th:each="t : ${dash.tipos}">
                <div class="kpi">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="etiqueta" th:text="'Cupos ' + ${t.nombre}">Cupos</span>
                        <i class="bi kpi-icono"
                            th:classappend="${#strings.containsIgnoreCase(t.nombre, 'moto')} ? 'bi-bicycle' : 'bi-car-front-fill'"></i>
                    </div>
                    <div class="valor">
                        <span th:text="${t.ocupados}">0</span><small> / <span th:text="${t.capacidad}">0</span></small>
                    </div>
                    <div class="progress my-2">
                        <div class="progress-bar"
                            th:classappend="${t.porcentaje >= 90} ? 'bg-danger' : (${t.porcentaje >= 70} ? 'bg-warning' : 'bg-success')"
                            th:style="'width:' + ${t.porcentaje} + '%'"></div>
                    </div>
                    <div class="sub"><b th:text="${t.disponibles}">0</b> disponibles</div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-xl-2">
                <div class="kpi">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="etiqueta">En el parqueadero</span>
                        <i class="bi bi-p-circle-fill kpi-icono"></i>
                    </div>
                    <div class="valor" th:text="${dash.totalOcupados}">0</div>
                    <div class="sub">vehículos ahora</div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-xl-2">
                <div class="kpi">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="etiqueta">Cupos libres</span>
                        <i class="bi bi-check-circle-fill kpi-icono"></i>
                    </div>
                    <div class="valor" th:text="${dash.totalDisponibles}">0</div>
                    <div class="sub">de <span th:text="${dash.totalCapacidad}">0</span> en total</div>
                </div>
            </div>

            <div class="col-12 col-md-4 col-xl-2">
                <div class="kpi kpi-dinero">
                    <div class="d-flex justify-content-between align-items-start">
                        <span class="etiqueta">Ingresos de hoy</span>
                        <i class="bi bi-cash-coin kpi-icono"></i>
                    </div>
                    <div class="valor"
                        th:text="'$' + ${#numbers.formatDecimal(dash.ingresosHoy, 1, 'POINT', 0, 'COMMA')}">$0</div>
                    <div class="sub"><span th:text="${dash.reservasHoy}">0</span> reservas hoy
                        &middot; <i class="bi bi-arrow-repeat"></i> <span id="dash-hora"></span></div>
                </div>
            </div>

        </div>
    </div>

    <!-- ===================== MENSAJES (éxito / error) ===================== -->
    <div th:fragment="mensajes" class="container-xxl mt-3 no-print">
        <div class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-0" role="alert"
            th:if="${ok}">
            <i class="bi bi-check-circle-fill me-2"></i>
            <div th:text="${ok}"></div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-0" role="alert"
            th:if="${error}">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div th:text="${error}"></div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    </div>

    <!-- ===================== SUBPESTAÑAS DE RESERVAS ===================== -->
    <ul th:fragment="reservasTabs(activa)" class="nav nav-tabs mb-4 no-print">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activa == 'nueva'} ? 'active'" th:href="@{/reservas/nueva}">
                <i class="bi bi-plus-circle"></i> Nueva reserva
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activa == 'historial'} ? 'active'" th:href="@{/reservas}">
                <i class="bi bi-receipt"></i> Historial de reservas
            </a>
        </li>
    </ul>

    <!-- ===================== SCRIPTS (Bootstrap + actualización del dashboard) ===================== -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:inline="javascript">
            (function () {
                var url = /*[[@{/dashboard/fragmento}]]*/ '/dashboard/fragmento';

                function marcarHora() {
                    var e = document.getElementById('dash-hora');
                    if (e) { e.textContent = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }); }
                }
                marcarHora();

                // Cada 15 segundos se pide el dashboard nuevo y se reemplaza
                setInterval(function () {
                    fetch(url, { credentials: 'same-origin' })
                        .then(function (r) { return (r.ok && !r.redirected) ? r.text() : null; })
                        .then(function (html) {
                            if (!html) { return; }
                            var cont = document.getElementById('dashboard-wrap');
                            if (cont) { cont.outerHTML = html; marcarHora(); }
                        })
                        .catch(function () { /* sin conexión: se intenta de nuevo en el próximo ciclo */ });
                }, 15000);
            })();
        </script>
    </th:block>

</body>

</html>
