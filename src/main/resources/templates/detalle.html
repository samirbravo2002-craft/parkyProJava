<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle del cliente')}"></head>
<body>

    <div th:replace="~{fragments/layout :: header('agregar')}"></div>

    <main class="container-xxl my-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card card-custom">

                    <div class="card-header-custom p-4 text-center">
                        <i class="bi bi-info-circle-fill text-warning fs-1"></i>
                        <h2 class="fw-bold mb-0 mt-2">Detalle del Cliente</h2>
                        <small class="text-secondary">Información completa en el sistema</small>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white rounded-bottom">
                        <ul class="list-group list-group-flush mb-4">
                            <li class="list-group-item d-flex justify-content-between py-3">
                                <span class="fw-bold text-secondary"><i class="bi bi-card-text text-dark me-2"></i> Documento:</span>
                                <span class="text-dark fw-semibold" th:text="${cliente.usuario.tipoDocumento + ' ' + cliente.noDocumento}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between py-3">
                                <span class="fw-bold text-secondary"><i class="bi bi-person text-dark me-2"></i> Nombre:</span>
                                <span class="text-dark fw-semibold" th:text="${cliente.usuario.nombre}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between py-3">
                                <span class="fw-bold text-secondary"><i class="bi bi-person text-dark me-2"></i> Apellido:</span>
                                <span class="text-dark fw-semibold" th:text="${cliente.usuario.apellido}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between py-3">
                                <span class="fw-bold text-secondary"><i class="bi bi-envelope text-dark me-2"></i> Correo:</span>
                                <span class="text-dark fw-semibold" th:text="${cliente.usuario.correo}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between py-3">
                                <span class="fw-bold text-secondary"><i class="bi bi-telephone text-dark me-2"></i> Celular:</span>
                                <span class="text-dark fw-semibold" th:text="${cliente.usuario.celular}"></span>
                            </li>
                        </ul>

                        <h6 class="fw-bold mb-2"><i class="bi bi-car-front-fill text-warning"></i> Vehículos registrados</h6>
                        <ul class="list-group mb-4">
                            <li class="list-group-item d-flex justify-content-between align-items-center" th:each="v : ${vehiculos}">
                                <span class="badge text-bg-dark fs-6" th:text="${v.placa}"></span>
                                <span class="text-secondary small"
                                      th:text="${(v.tipoVehiculo != null ? v.tipoVehiculo.nombre : 'Sin tipo')
                                               + (v.marca != null ? ' · ' + v.marca : '')
                                               + (v.color != null ? ' · ' + v.color : '')}"></span>
                            </li>
                            <li class="list-group-item text-secondary small" th:if="${#lists.isEmpty(vehiculos)}">
                                Aún no tiene vehículos. Se registran solos al hacer su primera reserva.
                            </li>
                        </ul>

                        <div class="text-center">
                            <a th:href="@{/agregar}" class="btn btn-amarillo w-100 py-2"><i class="bi bi-arrow-left"></i> Volver a la lista</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
